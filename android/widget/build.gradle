// Android home-screen widget ("Hoy"). Plain-Java library module: `bubblewrap update` never touches it.
// Linked into the TWA by scripts/android-widget-patch.mjs (run from scripts/android-release.sh).
plugins {
    id 'com.android.library'
}

repositories {
    google()
    mavenCentral()
}

android {
    namespace 'com.kizunatracker.widget'
    compileSdk 36

    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // android.jar only has org.json stubs; the JVM tests need the real implementation.
    testImplementation 'org.json:json:20240303'
}
